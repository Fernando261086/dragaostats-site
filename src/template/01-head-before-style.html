<!-- PWA: permite "Instalar" a app no telemóvel/computador -->
<link rel="manifest" href="manifest.json" id="pwaManifestLink">
<script>
  // Por defeito, o manifesto normal (manifest.json) já é o de "só ver" — é o que
  // toda a gente vê ao instalar a partir da página principal. Só em /edicao (ou
  // ?view=edit) é que troca para o manifesto de edição, para o ícone instalado
  // dali abrir sempre a app completa, não o modo de leitura.
  const onEditPathEarly = location.pathname.replace(/\/$/, "").toLowerCase().endsWith("/edicao")
    || new URLSearchParams(location.search).get("view") === "edit";
  if(onEditPathEarly){
    document.getElementById("pwaManifestLink").setAttribute("href", "manifest-edit.json");
  }
</script>
